name: Daily refresh

# Codzienne odświeżanie newsów. Robota dzieje się TU (na runnerze GitHuba),
# nie na Vercelu - dzięki temu nie obowiązuje limit 60 s funkcji serverless.
on:
  schedule:
    # Cel: newsy gotowe o 8:00 CZASU POLSKIEGO przez cały rok.
    # GitHub Actions liczy harmonogram w UTC i nie ogarnia zmiany czasu, więc jeden wpis
    # trafiałby w 8:00 tylko przez pół roku. Dlatego odpalamy DWA okna godzinowe:
    #   6:xx UTC = 8:xx PL latem (CEST), 7:xx UTC = 8:xx PL zimą (CET),
    # a scripts/refresh.ts sam sprawdza godzinę w strefie Europe/Warsaw i kończy od razu,
    # jeśli jest przed 8:00. Dzięki temu okno "nie tej pory roku" nic nie robi.
    # W każdym oknie 3 próby co 20 min - skrypt pomija boxy już świeże, więc kolejne
    # przebiegi ponawiają tylko te, które padły (np. na 503 od Gemini).
    # Minuta :08 (nie :00) celowo - omija tłok schedulera GitHuba na pełnej godzinie.
    - cron: '8,28,48 6,7 * * *'
  # Przycisk "Run workflow" (ręcznie / testy) oraz punktualny zewnętrzny cron (cron-job.org, 8:05 PL).
  # Harmonogram GitHuba potrafi spóźnić się o kilka godzin, więc to on jest głównym wyzwalaczem,
  # a 'schedule' powyżej zostaje jako zapas. Zewnętrzny cron wysyła force=false (tylko boxy nieświeże).
  workflow_dispatch:
    inputs:
      force:
        description: 'Pełne odświeżenie (także boxy już świeże)'
        type: boolean
        default: true

# Gdyby przebieg się przeciągał, nie pozwól mu wisieć w nieskończoność.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

# actions: write - potrzebne do kroku "keepalive" na końcu (ponowne włączenie workflowu przez API).
permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Odśwież newsy
        run: npx tsx scripts/refresh.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Adres silnika RSS (Python/FastAPI na Vercelu), np. https://<deploy>.vercel.app/api/rss.
          # Na runnerze GitHuba nie ma VERCEL_URL, więc metodę 'rss' kierujemy tutaj.
          RSS_ENGINE_URL: ${{ secrets.RSS_ENGINE_URL }}
          # Ręczne uruchomienie odświeża wszystko; harmonogram i zewnętrzny cron (force=false) tylko boxy nieświeże.
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.force) != 'false' }}

      # GitHub sam wyłącza zaplanowane workflowy po 60 dniach bez commitów w repo
      # (stan "disabled_inactivity") - tak padło odświeżanie 7.10.2026.
      # Wywołanie "enable" na włączonym workflowie resetuje ten licznik, bez pustych commitów.
      - name: Keepalive (chroni harmonogram przed auto-wyłączeniem)
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
