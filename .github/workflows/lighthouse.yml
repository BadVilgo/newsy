name: Lighthouse

# Mierzy Core Web Vitals, dostępność i SEO na publicznych stronach (te nie wymagają
# logowania, więc audyt nie potrzebuje żadnych prawdziwych kluczy ani konta).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          GEMINI_API_KEY: placeholder

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
